<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="766" viewBox="0 0 1160 766" role="img" aria-labelledby="title description">
<title id="title">Easy Itch Push: Publish interface layout preview</title>
<desc id="description">Illustrative preview, not a captured Unity Editor window. Publish, Changelog, History and Settings tabs; Publish shows destination, enabled build profiles, version, release notes summary and publishing actions.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#35383d"/><stop offset="1" stop-color="#26292d"/></linearGradient>
<linearGradient id="button" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#547db2"/><stop offset="1" stop-color="#3b6398"/></linearGradient>
<style>
text{font-family:Arial,Helvetica,sans-serif;fill:#e6e8ec}
.muted{fill:#aeb6bf;font-size:15px}
.label{font-size:15px}
.heading{font-size:19px;font-weight:700}
.panel{fill:#34383d;stroke:#565b62;stroke-width:1.5}
.rule{stroke:#4d535a}
</style>
</defs>
<rect width="1160" height="766" fill="#171a1e"/>
<rect x="30" y="25" width="1100" height="700" rx="10" fill="url(#bg)" stroke="#515963"/>
<rect x="30" y="25" width="1100" height="49" rx="9" fill="#3e4147"/>
<text x="52" y="56" font-size="18" font-weight="700">Easy Itch Push</text>
<text x="940" y="56" font-size="14" fill="#c4c9cf">1.1.0 draft</text>
<text x="54" y="109" class="muted">Publish releases, edit notes and review your publishing history.</text>
<rect x="50" y="128" width="1060" height="43" rx="5" fill="#292d32" stroke="#575e67"/>
<rect x="53" y="131" width="261" height="37" rx="4" fill="#466c96"/>
<text x="183" y="155" text-anchor="middle" font-size="16" font-weight="700">Publish</text>
<text x="446" y="155" text-anchor="middle" font-size="16">Changelog</text>
<text x="712" y="155" text-anchor="middle" font-size="16">History</text>
<text x="977" y="155" text-anchor="middle" font-size="16">Settings</text>
<text x="55" y="211" font-size="23" font-weight="700">Publish a build</text>
<text x="55" y="234" class="muted">Choose a destination, check your enabled profiles and publish your build.</text>

<rect x="53" y="256" width="678" height="158" rx="6" class="panel"/>
<text x="69" y="284" class="heading">Destination</text>
<rect x="70" y="296" width="644" height="34" rx="4" fill="#2b3036" stroke="#5a626c"/>
<rect x="73" y="299" width="319" height="28" rx="4" fill="#426992"/>
<text x="230" y="319" text-anchor="middle" font-size="15">Release</text>
<text x="552" y="319" text-anchor="middle" font-size="15" fill="#c3cbd4">Test</text>
<text x="71" y="355" font-size="19" font-weight="700">hush-cult/depthcall</text>
<text x="71" y="378" class="muted">https://hush-cult.itch.io/depthcall</text>

<rect x="53" y="424" width="678" height="160" rx="6" class="panel"/>
<text x="69" y="452" class="heading">Build profiles</text>
<text x="622" y="452" font-size="14" fill="#b1cced">Configure</text>
<path d="M69 464H715" class="rule"/>
<text x="72" y="492" class="label">Windows</text>
<text x="465" y="492" class="muted">Local</text>
<text x="619" y="492" class="muted">windows</text>
<path d="M69 503H715" class="rule"/>
<text x="72" y="527" class="label">WebGL</text>
<text x="465" y="527" class="muted">Local</text>
<text x="619" y="527" class="muted">html5</text>
<path d="M69 536H715" class="rule"/>
<text x="72" y="563" class="label">macOS</text>
<text x="440" y="563" class="muted">GitHub Actions</text>
<text x="633" y="563" class="muted">mac</text>

<rect x="53" y="598" width="678" height="55" rx="6" fill="url(#button)" stroke="#6c9cce"/>
<text x="390" y="632" text-anchor="middle" font-size="20" font-weight="700">Build &amp; Publish (Release)</text>
<rect x="53" y="662" width="331" height="40" rx="5" class="panel"/>
<rect x="395" y="662" width="336" height="40" rx="5" class="panel"/>
<text x="217" y="687" text-anchor="middle" font-size="16">Build only</text>
<text x="562" y="687" text-anchor="middle" font-size="16">Publish existing</text>

<rect x="743" y="256" width="367" height="154" rx="6" class="panel"/>
<text x="763" y="284" class="heading">Version</text>
<text x="765" y="308" class="muted">Major</text><text x="874" y="308" class="muted">Minor</text><text x="985" y="308" class="muted">Patch</text>
<rect x="762" y="315" width="100" height="35" rx="4" fill="#242a30" stroke="#646a73"/>
<rect x="872" y="315" width="100" height="35" rx="4" fill="#242a30" stroke="#646a73"/>
<rect x="982" y="315" width="107" height="35" rx="4" fill="#242a30" stroke="#646a73"/>
<text x="778" y="340" font-size="17">1</text><text x="888" y="340" font-size="17">1</text><text x="999" y="340" font-size="17">1</text>
<text x="763" y="379" class="muted">Current: v1.1.1</text>

<rect x="743" y="422" width="367" height="133" rx="6" class="panel"/>
<text x="762" y="450" class="heading">Release notes</text>
<text x="1057" y="450" font-size="14" fill="#accdef">Edit</text>
<text x="763" y="480" class="muted">- Added adaptive camera framing</text>
<text x="763" y="503" class="muted">- Added gamepad support</text>
<text x="763" y="530" font-size="13" fill="#8f9ca9">Full editor in Changelog tab</text>

<rect x="743" y="567" width="367" height="135" rx="6" class="panel"/>
<text x="763" y="597" class="heading">Latest publication</text>
<text x="1056" y="597" font-size="14" fill="#accdef">History</text>
<text x="763" y="627" font-size="17">v1.1.0 · Release</text>
<text x="763" y="651" class="muted">2026-11-09 21:40</text>
<text x="763" y="675" font-size="14" fill="#a9d3b0">Published to all channels</text>
<text x="580" y="753" font-size="12" text-anchor="middle" fill="#95a3b1">Illustrative layout preview, not a screenshot captured from Unity Editor.</text>
</svg>