<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 860" width="1120" height="860" role="img" aria-labelledby="title desc">
<title id="title">Easy Itch Push 1.1 preview, Publish tab</title>
<desc id="desc">Illustrative rendering of the tabbed Easy Itch Push editor interface proposed in pull request 1. Not a captured Unity screenshot.</desc>
<defs>
  <linearGradient id="shell" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#303237"/><stop offset="1" stop-color="#24262b"/></linearGradient>
  <linearGradient id="header" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#393c42"/><stop offset="1" stop-color="#303339"/></linearGradient>
  <linearGradient id="button" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#3873b4"/><stop offset="1" stop-color="#275788"/></linearGradient>
  <filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#05080b" flood-opacity=".3"/></filter>
  <style>
    text {font-family:Arial,Helvetica,sans-serif;fill:#e4e6e9}
    .small{font-size:15px;fill:#b4bac4}
    .label{font-size:15px;fill:#c7cdd5}
    .big{font-size:21px;font-weight:700}
    .field{fill:#25282d;stroke:#4b5159;stroke-width:1.3}
    .line{stroke:#444a52;stroke-width:1}
  </style>
</defs>
<rect width="1120" height="860" fill="#191b1f"/>
<g filter="url(#shadow)">
